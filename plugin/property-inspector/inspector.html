<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; font: 13px system-ui; }
    body { margin: 16px; background: #202124; color: #eee; }
    label { display: block; margin-top: 14px; }
    input, select, button { box-sizing: border-box; width: 100%; padding: 8px; margin-top: 6px; color: inherit; background: #303236; border: 1px solid #62656a; border-radius: 5px; }
    button { cursor: pointer; } p { line-height: 1.6; } #status { white-space: pre-wrap; } small { color: #bec2c8; }
  </style>
  <script src="../libs/js/constants.js"></script>
  <script src="../libs/js/eventEmitter.js"></script>
  <script src="../libs/js/timers.js"></script>
  <script src="../libs/js/utils.js"></script>
  <script src="../libs/js/ulanziApi.js"></script>
</head>
<body>
  <h3 id="heading">Orca 工作区</h3>
  <label>Orca CLI 路径<input id="cliPath" placeholder="/Applications/Orca.app/Contents/Resources/bin/orca"></label>
  <button id="refresh" type="button">刷新项目</button>
  <p id="status" role="status">正在连接插件…</p>
  <p id="occupant" style="white-space: pre-wrap"></p>
  <small>拖几个按钮就启用几个位置，按设备上从左到右、从上到下自动排序，无需设置编号。自动汇总 Orca 全部环境中的 worktree，按下跳到对应终端。</small>
  <script src="inspector.js"></script>
</body>
</html>
