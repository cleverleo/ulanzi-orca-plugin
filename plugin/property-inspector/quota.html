<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; font: 13px system-ui; }
    body { margin: 16px; background: #202124; color: #eee; }
    label { display: block; margin-top: 14px; }
    input, select, button { box-sizing: border-box; width: 100%; padding: 8px; margin-top: 6px; color: inherit; background: #303236; border: 1px solid #62656a; border-radius: 5px; }
    button { cursor: pointer; } p, small { line-height: 1.6; } small { color: #bec2c8; }
    #status { white-space: pre-wrap; } table { width: 100%; margin-top: 12px; border-collapse: collapse; font-size: 12px; }
    td, th { padding: 7px 3px; border-bottom: 1px solid #45484d; text-align: left; }
    details { margin-top: 16px; }
  </style>
  <script src="../libs/js/constants.js"></script>
  <script src="../libs/js/eventEmitter.js"></script>
  <script src="../libs/js/timers.js"></script>
  <script src="../libs/js/utils.js"></script>
  <script src="../libs/js/ulanziApi.js"></script>
</head>
<body>
  <h3><span data-i18n>Agent 额度</span></h3>
  <label><span data-i18n>绑定的 Agent</span><select id="provider"><option value="claude">Claude</option></select></label>
  <button id="refresh" type="button"><span data-i18n>刷新额度</span></button>
  <p id="status" role="status"><span data-i18n>正在读取 Orca 额度…</span></p>
  <small><span data-i18n>显示已用比例，优先显示本机额度；本机无额度数据时才使用远程环境，并显示来源。每 30 秒与 Orca 同步；按下按钮也会重新读取。</span></small>
  <table><thead><tr><th><span data-i18n>环境</span></th><th><span data-i18n>周期</span></th><th><span data-i18n>已用</span></th><th><span data-i18n>重置</span></th></tr></thead><tbody id="entries"></tbody></table>
  <details><summary><span data-i18n>高级设置</span></summary><label><span data-i18n>Orca CLI 路径</span><input id="cliPath" placeholder="/Applications/Orca.app/Contents/Resources/bin/orca"></label></details>
  <script src="quota-inspector.js"></script>
</body>
</html>
